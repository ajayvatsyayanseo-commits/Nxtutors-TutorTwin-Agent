name: CI

# Two jobs, because they need two runtimes and there is no reason to make the
# Node work wait on Postgres coming up. Both must pass before `release` builds
# an image - `needs:` is the gate, and it is the whole "no deploy on failing
# tests" rule.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an older one on the same ref. Two CI runs racing to
  # tag the same image is a coin toss over which one wins.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API - lint, types, tests, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # The integration suite builds its schema with the real migrations, so
        # this must be a real Postgres. pgvector is required by the RAG tables.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tutortwin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TUTORTWIN_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tutortwin_test
      TUTORTWIN_DATABASE_MIGRATION_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tutortwin_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Migrations apply from an empty database
        # Proves the acceptance item directly: this database was created empty
        # seconds ago, and every table the tests use is built by a migration.
        run: alembic upgrade head

      - name: Migrations match the models
        # Autogenerate drift. A model changed without a migration passes every
        # test on a developer's already-migrated database and fails on the first
        # deploy to a fresh one.
        run: alembic check

      - name: Tests
        run: pytest --cov=tutortwin --cov-report=term --cov-fail-under=78

      - name: Dependency audit
        # Advisory: a new CVE in a transitive dependency should be visible on the
        # next run, not block a release that has nothing to do with it. Promote
        # to blocking once the baseline is clean and stays clean.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

  admin:
    name: Control plane - types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Component and unit tests
        run: npm run test

      - name: Production build
        # The gate the phase brief names: no completion on a failing build.
        run: npm run build

      - name: Audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Control plane - end-to-end subset
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, admin]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tutortwin_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DSN: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tutortwin_e2e
      TUTORTWIN_INTERNAL_API_KEY: ci-internal-key
      E2E_ADMIN_EMAIL: e2e-super@example.com
      E2E_ADMIN_PASSWORD: e2e-super-admin-password

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - run: pip install -e ".[dev]"

      - name: Migrate and bootstrap the first administrator
        env:
          TUTORTWIN_DATABASE_MIGRATION_URL: ${{ env.DSN }}
          TUTORTWIN_DATABASE_URL: ${{ env.DSN }}
        run: |
          alembic upgrade head
          HASH=$(python -m tutortwin.cli.admin hash-password --password "$E2E_ADMIN_PASSWORD")
          TUTORTWIN_ADMIN_BOOTSTRAP_EMAIL="$E2E_ADMIN_EMAIL" \
          TUTORTWIN_ADMIN_BOOTSTRAP_PASSWORD_HASH="$HASH" \
            python -m tutortwin.cli.admin bootstrap --no-force-change

      - name: Start the API
        env:
          TUTORTWIN_DATABASE_URL: ${{ env.DSN }}
          TUTORTWIN_DATABASE_MIGRATION_URL: ${{ env.DSN }}
          TUTORTWIN_ENVIRONMENT: test
          # The fixture student has to be entitled, or every request is refused
          # at the gate and no conversation is ever created.
          TUTORTWIN_FAKE_PRO_SUBJECTS: '["+919999000001"]'
          PORT: "8001"
          HOST: 127.0.0.1
        run: |
          python -m tutortwin &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/healthz && break
            sleep 1
          done

      - name: Seed and run the suite
        working-directory: apps/admin
        env:
          TUTORTWIN_API_URL: http://127.0.0.1:8001
          ADMIN_BASE_URL: http://127.0.0.1:3101
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx tsx e2e/seed.ts
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7

  infra:
    name: Infrastructure - format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate
        # No backend and no credentials: this checks the configuration is
        # coherent, not that it can reach a cloud account.
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The gate. An image is never built from a commit whose tests failed,
    # because an image that exists is an image somebody can deploy.
    needs: [api, admin, e2e, infra]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tutortwin-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the control-plane image
        uses: docker/build-push-action@v6
        with:
          context: apps/admin
          push: false
          tags: tutortwin-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
