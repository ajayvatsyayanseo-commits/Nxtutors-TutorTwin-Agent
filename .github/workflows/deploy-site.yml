# Public site -> nxtutortwin.nxtutors.com (CloudPanel, Node.js, port 3010)
#
# Built in CI and shipped as artefacts. The server never runs `npm run build`:
# a Next.js build wants ~1GB of RAM and several CPU-seconds, and doing it on the
# box that is serving students means a deploy competes with live traffic. CI has
# nothing else to do.
#
# `paths` scoping matters. Without it every push to the API redeploys the
# marketing site, which is churn and, on a bad day, an unrelated outage.

name: deploy site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  # Two deploys rsyncing into the same directory interleave files and leave a
  # half-old, half-new tree. Queue them instead.
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install
        working-directory: apps/site
        run: |
          # `npm install`, not `npm ci`. The lockfile resolves differently on
          # Linux than on the Windows machine it is generated on - npm rejects
          # it here with a picomatch version it cannot reconcile, while the
          # same file passes `npm ci` locally. Every dependency in package.json
          # is pinned to an exact version bar two, so re-resolving costs almost
          # nothing and removes a whole class of deploy failure.
          npm install --no-audit --no-fund

      - name: Typecheck and lint
        working-directory: apps/site
        run: npm run typecheck && npm run lint

      - name: Build
        working-directory: apps/site
        env:
          NEXT_PUBLIC_API_URL: https://${{ vars.DEPLOY_API_DOMAIN }}
          NEXT_PUBLIC_SITE_URL: https://${{ vars.DEPLOY_SITE_DOMAIN }}
          NEXT_PUBLIC_CASHFREE_MODE: ${{ vars.NEXT_PUBLIC_CASHFREE_MODE }}
        run: npm run build

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ vars.DEPLOY_PORT || 22 }}" -H \
            "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # Password auth, deliberately - there is no key path. The password
          # reaches ssh through SSHPASS in the environment and never appears on
          # a command line, so it stays out of the runner's process table.
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          echo "SSHPASS=${{ secrets.DEPLOY_SITE_SSH_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SSH_CMD=sshpass -e ssh -p ${{ vars.DEPLOY_PORT }}" >> "$GITHUB_ENV"
          echo "RSYNC_RSH=sshpass -e ssh -p ${{ vars.DEPLOY_PORT }}" >> "$GITHUB_ENV"

      - name: Ship the build
        env:
          TARGET: ${{ secrets.DEPLOY_SITE_USER }}@${{ secrets.DEPLOY_HOST }}
          DEST: ${{ secrets.DEPLOY_SITE_PATH }}
        run: |
          set -euo pipefail

          # `standalone` is the whole runtime: Next traces the imports and
          # bundles only what the server actually loads, so node_modules is
          # never copied. Three rsyncs because Next deliberately leaves static
          # and public OUTSIDE the standalone tree.
          rsync -az --delete -e "$RSYNC_RSH" \
            apps/site/.next/standalone/ "$TARGET:$DEST/"

          # No --delete here: it would wipe the standalone files just copied in.
          rsync -az -e "$RSYNC_RSH" \
            apps/site/.next/static/ "$TARGET:$DEST/.next/static/"

          if [ -d apps/site/public ]; then
            rsync -az -e "$RSYNC_RSH" \
              apps/site/public/ "$TARGET:$DEST/public/"
          fi

      - name: Restart
        env:
          TARGET: ${{ secrets.DEPLOY_SITE_USER }}@${{ secrets.DEPLOY_HOST }}
          DEST: ${{ secrets.DEPLOY_SITE_PATH }}
        run: |
          set -euo pipefail
          $SSH_CMD "$TARGET" bash -lc "'
            cd $DEST
            export PORT=${{ vars.DEPLOY_SITE_PORT }} HOSTNAME=127.0.0.1
            # CloudPanel installs Node per site through nvm, and nvm loads only
            # from an interactive shell profile. ssh host bash -lc is not
            # interactive, so node is absent entirely - which arrived as
            # nohup: failed to run command node and a 502 from nginx, with
            # every earlier step reporting success.
            export NVM_DIR=\"\$HOME/.nvm\"
            if [ -s \"\$NVM_DIR/nvm.sh\" ]; then
              . \"\$NVM_DIR/nvm.sh\" >/dev/null 2>&1 || true
            fi
            if ! command -v node >/dev/null 2>&1; then
              # nvm.sh missing or non-functional: take the newest installed node.
              NODE_BIN=\$(ls -d \"\$NVM_DIR\"/versions/node/*/bin 2>/dev/null | sort -V | tail -1)
              if [ -n \"\$NODE_BIN\" ]; then export PATH=\"\$NODE_BIN:\$PATH\"; fi
            fi
            if ! command -v node >/dev/null 2>&1; then
              echo \"FATAL: no node for this site user, and none under \$NVM_DIR\"
              echo \"Set the Node version for this site in CloudPanel.\"
              exit 1
            fi
            echo \"using node \$(node --version) from \$(command -v node)\"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 describe tutortwin-site >/dev/null 2>&1 \
                && pm2 restart tutortwin-site --update-env \
                || pm2 start server.js --name tutortwin-site
              pm2 save
            else
              # No PM2: nohup is a stopgap that does NOT survive a reboot.
              # A PID file, not pkill -f. This entire script is the command
              # line of the bash process running it, so any pkill -f pattern
              # written here matches that process and kills the deploy itself -
              # which arrives back as ssh exit 255 with no output at all. The
              # pattern could not have worked anyway: the process command line
              # is node server.js, with no path in it.
              [ -f app.pid ] && xargs -r kill < app.pid 2>/dev/null || true
              nohup node server.js > site.log 2>&1 &
              echo \$! > app.pid
            fi
          '"

      - name: Verify it is actually serving
        env:
          TARGET: ${{ secrets.DEPLOY_SITE_USER }}@${{ secrets.DEPLOY_HOST }}
          DEST: ${{ secrets.DEPLOY_SITE_PATH }}
        run: |
          # A deploy that restarts a process and never checks is a deploy that
          # reports success while the site returns 502.
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://${{ vars.DEPLOY_SITE_DOMAIN }}/ || true)
            [ "$code" = "200" ] && echo "site is up" && exit 0
            sleep 6
          done
          echo "site did not return 200 after 60s (last code: $code)"
          # A 502 means nginx is healthy and the app is not listening. Only the
          # server can say why, so fetch the evidence rather than leaving a
          # bare "did not return 200" for someone to go and look up by hand.
          echo "--- is there a runtime on PATH? ---"
          $SSH_CMD "$TARGET" "command -v node || echo 'MISSING: node not on PATH'" || true
          echo "--- last 60 lines of site.log ---"
          $SSH_CMD "$TARGET" "tail -60 $DEST/site.log 2>/dev/null || echo '(no site.log - the process never wrote one)'" || true
          exit 1
